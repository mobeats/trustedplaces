name: HTML check

on:
  push:
    branches: ["master", "improve/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v0.6.0
        with:
          root: .
          css: false
